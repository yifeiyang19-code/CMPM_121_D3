<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D3 project</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/game/style.css" />
    <link rel="stylesheet" href="/game/hud.css" />
  </head>
  <body>
    <main id="app">
      <div id="grid"></div>
      <aside id="hud">
        <dl>
          <dt>Position</dt>
          <dd id="position"></dd>
          <dt>Terrain</dt>
          <dd id="terrain"></dd>
          <dt>Inventory</dt>
          <dd>
            <table>
              <thead class="sr-only">
                <tr>
                  <th scope="col">Material</th>
                  <th scope="col">Count</th>
                </tr>
              </thead>
              <tbody id="inventory"></tbody>
            </table>
          </dd>
          <dt>Recipes</dt>
          <dd>
            <table>
              <thead class="sr-only">
                <tr>
                  <th scope="col">Item</th>
                  <th scope="col">Requires</th>
                  <th scope="col">Status</th>
                </tr>
              </thead>
              <tbody id="recipes"></tbody>
            </table>
          </dd>
        </dl>
        <p id="live" aria-live="polite"></p>
        <button id="mute" type="button" aria-pressed="false">Sound: on</button>
      </aside>
    </main>
    <script type="module" src="/game/main.ts"></script>
  </body>
</html>
